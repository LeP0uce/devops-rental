name: Java service

# Pas de filtre `paths` sur pull_request : les contrôles requis par la
# protection de `main` doivent être rapportés sur TOUTES les PR, sinon une PR
# qui ne touche pas ce service resterait bloquée en « Expected — Waiting ».
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Moindre privilège : lecture seule par défaut, élargie job par job.
permissions:
  contents: read

# Une nouvelle exécution sur la même PR annule la précédente devenue obsolète.
# Sur main on n'annule pas : chaque commit doit produire son image.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SERVICE_DIR: apps/car-rental-service
  IMAGE_NAME: ghcr.io/${{ github.repository }}/car-rental-service

defaults:
  run:
    working-directory: apps/car-rental-service

jobs:
  tests:
    name: Java tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run unit and HTTP tests
        run: ./gradlew --no-daemon test
      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-test-reports
          path: |
            ${{ env.SERVICE_DIR }}/build/test-results/test/
            ${{ env.SERVICE_DIR }}/build/reports/tests/test/
          retention-days: 7
          if-no-files-found: warn

  quality:
    name: Java quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Checkstyle
        run: ./gradlew --no-daemon checkstyleMain checkstyleTest
      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-checkstyle-reports
          path: ${{ env.SERVICE_DIR }}/build/reports/checkstyle/
          retention-days: 7
          if-no-files-found: warn

  image:
    name: Java Docker image
    needs: [tests, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # utilisé uniquement lors d'un push sur main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build (and push on main only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.SERVICE_DIR }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=car-rental-service
          cache-to: type=gha,mode=max,scope=car-rental-service
