name: Java service

# Pas de filtre `paths` sur pull_request : les contrôles requis par la
# protection de `main` doivent être rapportés sur TOUTES les PR, sinon une PR
# qui ne touche pas ce service resterait bloquée en « Expected — Waiting ».
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Moindre privilège : lecture seule par défaut, élargie job par job.
permissions:
  contents: read

# Une nouvelle exécution sur la même PR annule la précédente devenue obsolète.
# Sur main on n'annule pas : chaque commit doit produire son image.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SERVICE_DIR: apps/car-rental-service
  IMAGE_NAME: ghcr.io/${{ github.repository }}/car-rental-service

defaults:
  run:
    working-directory: apps/car-rental-service

jobs:
  tests:
    name: Java tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run unit and HTTP tests
        run: ./gradlew --no-daemon test
      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-test-reports
          path: |
            ${{ env.SERVICE_DIR }}/build/test-results/test/
            ${{ env.SERVICE_DIR }}/build/reports/tests/test/
          retention-days: 7
          if-no-files-found: warn

  quality:
    name: Java quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Checkstyle
        run: ./gradlew --no-daemon checkstyleMain checkstyleTest
      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-checkstyle-reports
          path: ${{ env.SERVICE_DIR }}/build/reports/checkstyle/
          retention-days: 7
          if-no-files-found: warn

  image:
    name: Java Docker image
    needs: [tests, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # utilisé uniquement lors d'un push sur main
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build (and push on main only)
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.SERVICE_DIR }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=car-rental-service
          cache-to: type=gha,mode=max,scope=car-rental-service
