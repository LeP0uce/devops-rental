name: Dependency review

# Examine le DIFF des manifestes de dépendances d'une PR (graphe de
# dépendances GitHub + base d'avis) : bloque l'introduction d'une dépendance
# vulnérable avant la fusion. Trivy, lui, examine le contenu FINAL de l'image.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
